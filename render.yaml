services:
  - type: web
    name: copo-app
    env: python
    plan: free
    # The build command now points to our script
    buildCommand: "./build.sh"
    # The start command ONLY starts the server
    startCommand: "gunicorn copo_management_system.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: copo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: 4
      # Superuser credentials are now only used by the build script
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@mail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin@123

databases:
  - name: copo-db
    plan: free