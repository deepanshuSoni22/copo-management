services:
  - type: web
    name: copo-app
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >
      bash -c "
        python manage.py createsuperuser --noinput &&
        gunicorn copo_management_system.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: copo-db
          property: connectionString
      - key: SECRET_KEY
        value: django-insecure-*xd2bmo0awi2l9i3&lsc1)lp_9a_p^5lb^$w-=g@%9g^8f)0%h
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: copo-app.onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin              # Change if needed
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@mail.com  # Change if needed
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin@123    # Change this securely

databases:
  - name: copo-db
    plan: free
